  <path d="M8 24 h16 a5 5 0 0 1 5 5 v13 H3 v-13 a5 5 0 0 1 5-5z" fill="#b6a6e0" stroke="#3a4a52" stroke-width="1.5"/>
  <path d="M10 28 h12 v4 H10z" fill="#9b88c9" opacity="0.55"/>
