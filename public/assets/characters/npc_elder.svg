  <ellipse cx="20" cy="17" rx="1.6" ry="2.4" fill="#3a4a52"/>
  <rect x="11.2" y="15.2" width="1" height="1.6" fill="#ffffff"/>
  <rect x="19.2" y="15.2" width="1" height="1.6" fill="#ffffff"/>
  <circle cx="9" cy="20" r="1.6" fill="#ffb3b3" opacity="0.55"/>
  <circle cx="23" cy="20" r="1.6" fill="#ffb3b3" opacity="0.55"/>
