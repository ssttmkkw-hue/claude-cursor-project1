  <circle cx="26.1" cy="17" r="2.2" fill="#c9a06e" stroke="#3a4a52" stroke-width="0.8"/>
  <!-- 腿 -->
  <rect x="10" y="42" width="4" height="5" rx="1" fill="#3a4a52"/>
  <rect x="18" y="42" width="4" height="5" rx="1" fill="#3a4a52"/>
